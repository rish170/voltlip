<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voltlip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Idle Strip (centered at top edge) -->
    <div id="strip-wrapper" class="strip-wrapper">
      <div id="strip" class="strip"></div>
    </div>

    <!-- Sliding Hover Card -->
    <div id="card" class="card">
      <!-- Battery Frame -->
      <div id="battery-frame" class="battery-frame">
        <div id="inner-bar" class="inner-bar">
          <div class="segment"><div id="seg-1" class="seg-fill"></div></div>
          <div class="segment"><div id="seg-2" class="seg-fill"></div></div>
          <div class="segment"><div id="seg-3" class="seg-fill"></div></div>
          <div class="segment"><div id="seg-4" class="seg-fill"></div></div>
        </div>
      </div>

      <!-- Text Row: Percentage on left, Status on right -->
      <div id="text-row" class="text-row">
        <span id="percent-label" class="percent-label">100%</span>
        <span id="status-label" class="status-label">Discharging</span>
      </div>
    </div>
  </div>

  <canvas id="measure-canvas" class="measure-canvas"></canvas>
  <script src="renderer.js"></script>
</body>
</html>
